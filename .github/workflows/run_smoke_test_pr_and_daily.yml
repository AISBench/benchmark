name: run_smoke_framework_daily

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 2 * * *'
  pull_request:
    paths:
      - 'ais_bench/benchmark/**'
      - 'smoke_tests/**'
      - 'plugins/prefix_cache/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PY310_VERSION: 3.10.19
  # PRs use functional workloads; scheduled/manual runs retain full coverage.
  # Repository variable 0/1 permits a same-commit controlled comparison.
  AISBENCH_SMOKE_FAST: ${{ vars.AISBENCH_SMOKE_FAST || (github.event_name == 'pull_request' && '1' || '0') }}

jobs:
  run_smoke_test_cases:
    environment: smoke-test-approval
    runs-on: [self-hosted, Linux, smoke]
    timeout-minutes: 30
    env:
      PROJECT_WORKSPACE_PATH: ${{ github.workspace }}/smoke_tests/RunWorkspace/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Run Smoke Cases
        id: run_cases  # 增加ID，用于后续判断
        continue-on-error: true  # 即使测试执行失败，也继续后续步骤
        run: |
          if bash smoke_tests/scripts/run_steps.sh -t short; then
            echo "[INFO] Smoke execution finished; checking complete case results next."
            echo "test_execution_failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "[ERROR] Smoke execution failed."
            echo "test_execution_failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Get Result files
        id: get_results  # 增加ID
        if: always()
        continue-on-error: true  # 尽力保存取消/失败前已完成用例的证据
        run: |
          RUNWORKSPACE_DIR="$PROJECT_WORKSPACE_PATH"
          if [ ! -d "$RUNWORKSPACE_DIR" ]; then
            echo "test_case_failed=true" >> "$GITHUB_OUTPUT"
            echo "[ERROR] This run has no workspace/results."
            exit 1
          fi
          if python3 smoke_tests/framework/smoke_timing.py --check "$RUNWORKSPACE_DIR/case_timings.jsonl" && \
             [ ! -d "$RUNWORKSPACE_DIR/failed_case_logs" ]; then
            echo "test_case_failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "test_case_failed=true" >> "$GITHUB_OUTPUT"
            echo "[ERROR] Missing, incomplete or failed case results."
          fi
          RUNWORKSPACE_NAME=$(basename "$RUNWORKSPACE_DIR")
          tar -czf "${RUNWORKSPACE_NAME}.tar.gz" -C "$(dirname "$RUNWORKSPACE_DIR")" "$RUNWORKSPACE_NAME"
          echo "Packed this run as ${RUNWORKSPACE_NAME}.tar.gz"

      - name: Upload Results
        if: always()  # 关键：无论前面步骤是否失败，都执行上传
        uses: actions/upload-artifact@v4
        with:
          name: smoke_test_results
          path: |
            *.tar.gz
            ${{ env.PROJECT_WORKSPACE_PATH }}/case_timings.jsonl
          retention-days: 7

      - name: Final Check
        if: always()  # 最后统一判断是否失败，终止Job
        run: |
          # 判断测试执行是否失败 或 测试用例是否失败
          if [ "${{ steps.run_cases.outcome }}" != "success" ] || \
             [ "${{ steps.get_results.outcome }}" != "success" ] || \
             [ "${{ steps.run_cases.outputs.test_execution_failed }}" != "false" ] || \
             [ "${{ steps.get_results.outputs.test_case_failed }}" != "false" ]; then
            echo "[ERROR] Smoke test failed (execution or test cases)!"
            exit 1
          else
            echo "[INFO] Smoke test passed completely!"
            exit 0
          fi